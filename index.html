<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck PRO 2.2</title><link rel="manifest" href="./manifest.json"><style>
body{font-family:system-ui;margin:0;background:#f3f3f1;color:#222}main{max-width:1180px;margin:auto;padding:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:15px}.grid,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.stat{background:#f4f4f4;padding:10px;border-radius:9px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #bbb;border-radius:8px}button{font-weight:800}.row,.stock{display:flex;direction:ltr;height:30px;margin:5px 0}.p{border:1px solid #777;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden}.ok{font-weight:800}.warn{font-weight:800}small{opacity:.72}</style></head><body><main>
<h1>Deck PRO 2.2 — מנוע חישוב מאומת</h1><div class="card"><div class="grid">
<label>מצב<select id="mode"><option value="new">דק חדש — תכנן תמיכות חיבור</option><option value="existing">תשתית קיימת</option></select></label>
<label>אורך דק מ׳<input id="L" type="number" step=".01" value="7.60"></label><label>רוחב דק מ׳<input id="W" type="number" step=".01" value="4.32"></label>
<label>אורך לוח מ׳<input id="BL" type="number" step=".001" value="4.88"></label><label>רוחב לוח מ׳<input id="BW" type="number" step=".001" value=".14"></label>
<label>רווח מ׳<input id="G" type="number" step=".001" value=".005"></label><label>Kerf מ׳<input id="K" type="number" step=".001" value=".003"></label>
<label>מרווח קורות מקס׳ מ׳<input id="J" type="number" step=".01" value=".40"></label><label>חתיכה מינ׳ מ׳<input id="MIN" type="number" step=".01" value=".60"></label>
</div><button id="calc">חשב ומקסם ניצול</button></div><div id="out"></div></main><script src="./app.js"></script></body></html>
