<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck PRO 2.0</title><link rel="manifest" href="./manifest.json"><style>body{font-family:system-ui;background:#f4f4f2;margin:0;color:#222}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;padding:15px;margin:12px 0;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin-top:4px}.row{display:flex;direction:ltr;height:28px;margin:5px 0}.p{border:1px solid #888;text-align:center;font-size:11px;overflow:hidden}.bar{display:flex;direction:ltr;height:24px;background:#ddd}.good{font-weight:bold}.warn{font-weight:bold}</style></head><body><main><h1>Deck PRO 2.0 — אבטיפוס טכני</h1><div class="card"><div class="grid">
<label>מצב<select id="mode"><option value="new">דק חדש — תכנן תשתית</option><option value="existing">תשתית קיימת</option></select></label>
<label>אורך דק מ׳<input id="L" type="number" step=".01" value="11.50"></label><label>רוחב דק מ׳<input id="W" type="number" step=".01" value="1.12"></label>
<label>אורך לוח מ׳<input id="BL" type="number" step=".001" value="4.88"></label><label>רוחב לוח מ׳<input id="BW" type="number" step=".001" value=".14"></label>
<label>רווח מ׳<input id="G" type="number" step=".001" value=".005"></label><label>Kerf מ׳<input id="K" type="number" step=".001" value=".003"></label>
<label>מרווח קורות מ׳<input id="J" type="number" step=".01" value=".40"></label><label>חתיכה מינ׳ מ׳<input id="MIN" type="number" step=".01" value=".60"></label>
<label>יעד ניצול %<input id="T" type="number" value="92"></label></div><button id="calc">חשב עבודה</button></div><div id="out"></div></main><script src="./app.js"></script></body></html>
