<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck PRO 2.4</title><link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f5f5;color:#111}
main{max-width:1180px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:11px 0}
.grid,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.stat{border:1px solid #ddd;padding:9px;border-radius:9px}
input,select,button{width:100%;padding:9px;margin-top:4px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111}
button{font-weight:800;cursor:pointer}.solution{border:2px solid #111}.solution h2{margin-top:0}.deck{direction:ltr;border:2px solid #111;padding:2px}
.r{height:18px;display:flex;border-bottom:1px solid #ddd}.r:last-child{border-bottom:0}.pc{box-sizing:border-box;border-right:2px solid #111;font-size:8px;overflow:hidden;text-align:center}.pc:last-child{border-right:0}
.stock{display:flex;direction:ltr;height:27px;margin:4px 0}.sp{border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:9px;overflow:hidden}
.ok{font-weight:800}.muted,small{opacity:.7}.tag{display:inline-block;border:1px solid #111;border-radius:999px;padding:3px 8px;margin:2px;font-size:12px}
details{border-top:1px solid #ddd;margin-top:10px;padding-top:8px}summary{font-weight:800;cursor:pointer}
</style></head><body><main>
<h1>Deck PRO 2.4 — Multi Solution Engine</h1>
<div class="card"><div class="grid">
<label>אורך דק (מ׳)<input id="L" type="number" step=".01" value="7.60"></label>
<label>רוחב דק (מ׳)<input id="W" type="number" step=".01" value="4.32"></label>
<label>אורך לוח גלם (מ׳)<input id="BL" type="number" step=".001" value="4.88"></label>
<label>רוחב לוח (ס״מ)<input id="BWcm" type="number" step=".1" value="14"></label>
<label>רווח (מ״מ)<input id="Gmm" type="number" step=".5" value="5"></label>
<label>Kerf (מ״מ)<input id="Kmm" type="number" step=".1" value="3"></label>
<label>חתיכה מינ׳ (ס״מ)<input id="MINcm" type="number" step="1" value="60"></label>
<label>מרחק קו ראשון/אחרון מינ׳ (ס״מ)<input id="EDGEcm" type="number" step="1" value="40"></label>
<label>מרחק מינ׳ בין קווי חיבור (ס״מ)<input id="LINEcm" type="number" step="1" value="40"></label>
<label>מספר פתרונות להצגה<select id="N"><option>4</option><option selected>6</option><option>8</option></select></label>
</div><button id="calc">מצא פתרונות חיפוי</button>
<p class="muted">בשלב זה המנוע אופטימלי לחיפוי בלבד. התשתית תחושב לאחר בחירת פתרון.</p></div>
<div id="out"></div></main><script src="./app.js"></script></body></html>
