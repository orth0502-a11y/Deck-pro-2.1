<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck PRO 2.3 A/B</title><link rel="manifest" href="./manifest.json"><style>
body{font-family:system-ui;margin:0;background:#f3f3f1;color:#222}main{max-width:1200px;margin:auto;padding:14px}.card{background:white;border-radius:15px;padding:15px;margin:11px 0}.grid,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.stat{background:#f4f4f4;padding:9px;border-radius:9px}input,select,button{width:100%;box-sizing:border-box;padding:9px;margin-top:3px;border:1px solid #bbb;border-radius:8px}button{font-weight:800}.deck{direction:ltr;border:2px solid #555;padding:2px;overflow:hidden}.r{height:18px;display:flex}.r:nth-child(even){background:#f6f6f6}.pc{border-right:2px solid #222;box-sizing:border-box;font-size:8px;overflow:hidden;text-align:center}.pc:last-child{border-right:0}.ok{font-weight:800}.bad{font-weight:800}small{opacity:.72}.stock{display:flex;direction:ltr;height:28px;margin:5px 0}.sp{border:1px solid #777;display:flex;align-items:center;justify-content:center;font-size:9px;overflow:hidden}</style></head><body><main>
<h1>Deck PRO 2.3 — שתי וערב A/B</h1><div class="card"><div class="grid">
<label>מצב<select id="mode"><option value="new">דק חדש</option><option value="existing">תשתית קיימת</option></select></label>
<label>אורך דק (מ׳)<input id="L" type="number" step=".01" value="7.60"></label><label>רוחב דק (מ׳)<input id="W" type="number" step=".01" value="4.32"></label>
<label>אורך לוח גלם (מ׳)<input id="BL" type="number" step=".001" value="4.88"></label>
<label>רוחב לוח (ס״מ)<input id="BWcm" type="number" step=".1" value="14"></label><label>רווח (מ״מ)<input id="Gmm" type="number" step=".5" value="5"></label>
<label>Kerf (מ״מ)<input id="Kmm" type="number" step=".1" value="3"></label><label>מרווח קורות מקס׳ (ס״מ)<input id="Jcm" type="number" step="1" value="40"></label>
<label>חתיכה מינ׳ (ס״מ)<input id="MINcm" type="number" step="1" value="60"></label><label>סטייה מינ׳ בין קווי A/B (ס״מ)<input id="STcm" type="number" step="1" value="20"></label>
</div><button id="calc">חשב שתי וערב חוקי</button></div><div id="out"></div></main><script src="./app.js"></script></body></html>
